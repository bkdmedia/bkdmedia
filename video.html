<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video — BKD Media</title>

<meta name="description" content="Temukan video terbaru BKD Tutorials dan ORB7 di BKD Media.">

<link rel="icon" href="logo.svg">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #080b10;
    color: #f5f7fa;
    font-family: Inter, Arial, Helvetica, sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input {
    font: inherit;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
}

/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 11, 16, 0.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
}

.nav {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 18px;
    font-weight: 700;
}

.brand img {
    width: 34px;
    height: 34px;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 30px;
    font-size: 14px;
    color: #aeb7c4;
}

.nav-links a {
    transition: color 0.2s ease;
}

.nav-links a:hover,
.nav-links a.active {
    color: #ffffff;
}

/* =========================
   HERO
========================= */

.hero {
    padding: 78px 0 45px;
    text-align: center;
}

.eyebrow {
    margin-bottom: 14px;
    color: #6fa8ff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.hero h1 {
    margin: 0;
    font-size: clamp(40px, 6vw, 64px);
    line-height: 1.05;
    letter-spacing: -0.04em;
}

.hero p {
    max-width: 650px;
    margin: 20px auto 0;
    color: #9ca6b4;
    font-size: 16px;
    line-height: 1.7;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 28px;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.filter-btn {
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px;
    background: rgba(255,255,255,0.035);
    color: #aeb7c4;
    cursor: pointer;
    transition: all 0.2s ease;
}

.filter-btn:hover {
    border-color: rgba(111,168,255,0.45);
    color: #ffffff;
}

.filter-btn.active {
    border-color: #ffffff;
    background: #ffffff;
    color: #080b10;
}

.search {
    width: 270px;
}

.search input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.04);
    color: #ffffff;
}

.search input::placeholder {
    color: #687383;
}

.search input:focus {
    border-color: rgba(111,168,255,0.6);
}

/* =========================
   STATUS
========================= */

.status {
    min-height: 24px;
    margin-bottom: 18px;
    color: #7f8a99;
    font-size: 13px;
}

/* =========================
   VIDEO GRID
========================= */

.video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.video-card {
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    background: #0d1118;
    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.video-card:hover {
    transform: translateY(-4px);
    border-color: rgba(111,168,255,0.28);
    box-shadow: 0 15px 45px rgba(0,0,0,0.28);
}

.thumbnail {
    position: relative;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    background: #111722;
}

.thumbnail img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(
        rgba(0,0,0,0),
        rgba(0,0,0,0.18)
    );
}

.play span {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    padding-left: 3px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    background: rgba(0,0,0,0.72);
    font-size: 19px;
}

.video-info {
    padding: 17px;
}

.video-title {
    display: -webkit-box;
    overflow: hidden;
    font-size: 15px;
    font-weight: 650;
    line-height: 1.45;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
}

.publisher {
    margin-top: 11px;
    color: #7faefc;
    font-size: 12px;
    font-weight: 600;
}

.meta {
    margin-top: 7px;
    color: #727d8c;
    font-size: 12px;
}

/* =========================
   MESSAGE
========================= */

.message {
    padding: 55px 20px;
    border: 1px dashed rgba(255,255,255,0.1);
    border-radius: 16px;
    color: #7f8a99;
    text-align: center;
}

/* =========================
   PAGINATION
========================= */

.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 45px 0 75px;
}

.page-btn {
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 9px;
    background: rgba(255,255,255,0.035);
    color: #aeb7c4;
    cursor: pointer;
}

.page-btn:hover:not(:disabled) {
    border-color: rgba(111,168,255,0.45);
    color: #ffffff;
}

.page-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.page-info {
    padding: 0 8px;
    color: #7f8a99;
    font-size: 13px;
}

/* =========================
   FOOTER
========================= */

footer {
    padding: 35px 0;
    border-top: 1px solid rgba(255,255,255,0.07);
    color: #697483;
    font-size: 13px;
}

.footer-inner {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .container {
        width: min(100% - 28px, 600px);
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding: 60px 0 35px;
    }

    .controls {
        align-items: stretch;
        flex-direction: column;
    }

    .filters {
        width: 100%;
    }

    .filter-btn {
        flex: 1;
    }

    .search {
        width: 100%;
    }

    .video-grid {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .footer-inner {
        flex-direction: column;
    }
}

@media (min-width: 801px) and (max-width: 1050px) {

    .video-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="container nav">

        <a href="index.html" class="brand">
            <img src="logo.svg" alt="BKD Media">
            <span>BKD Media</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="video.html" class="active">Videos</a>
        </nav>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

    <section class="hero">

        <div class="container">

            <div class="eyebrow">
                BKD Media
            </div>

            <h1>
                Video
            </h1>

            <p>
                Temukan video terbaru dari BKD Tutorials
                dan ORB7 dalam satu tempat.
            </p>

        </div>

    </section>


    <section class="container">

        <!-- FILTER + SEARCH -->

        <div class="controls">

            <div class="filters">

                <button
                    class="filter-btn active"
                    data-channel=""
                    onclick="changeChannel('')">
                    Semua
                </button>

                <button
                    class="filter-btn"
                    data-channel="bkd"
                    onclick="changeChannel('bkd')">
                    BKD Tutorials
                </button>

                <button
                    class="filter-btn"
                    data-channel="orb7"
                    onclick="changeChannel('orb7')">
                    ORB7
                </button>

            </div>


            <div class="search">

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Cari video..."
                    autocomplete="off">

            </div>

        </div>


        <!-- STATUS -->

        <div id="status" class="status">
            Memuat video...
        </div>


        <!-- VIDEO -->

        <div
            id="videoGrid"
            class="video-grid">
        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
            style="display:none;">
        </div>


        <!-- PAGINATION -->

        <div class="pagination">

            <button
                id="prevBtn"
                class="page-btn"
                onclick="previousPage()">
                ← Sebelumnya
            </button>

            <span
                id="pageInfo"
                class="page-info">
                Halaman 1
            </span>

            <button
                id="nextBtn"
                class="page-btn"
                onclick="nextPage()">
                Berikutnya →
            </button>

        </div>

    </section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <div class="container footer-inner">

        <div>
            © 2026 BKD Media
        </div>

        <div>
            Technology • Finance • Digital Lifestyle
        </div>

    </div>

</footer>


<script>

/* =====================================================
   API BKD MEDIA
===================================================== */

const API_URL =
    "https://bkdm-yt-api.anu1946store.workers.dev/videos";


/* =====================================================
   STATE
===================================================== */

let currentPage = 1;
let currentChannel = "";
let currentQuery = "";
let totalPages = 1;


/* =====================================================
   ELEMENTS
===================================================== */

const videoGrid =
    document.getElementById("videoGrid");

const statusEl =
    document.getElementById("status");

const messageEl =
    document.getElementById("message");

const pageInfo =
    document.getElementById("pageInfo");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const searchInput =
    document.getElementById("searchInput");


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos() {

    videoGrid.innerHTML = "";

    messageEl.style.display = "none";

    statusEl.textContent =
        "Memuat video...";


    const params =
        new URLSearchParams();


    params.set(
        "page",
        currentPage
    );


    params.set(
        "limit",
        "24"
    );


    if (currentChannel) {

        params.set(
            "channel",
            currentChannel
        );

    }


    if (currentQuery) {

        params.set(
            "q",
            currentQuery
        );

    }


    try {

        const response =
            await fetch(
                API_URL +
                "?" +
                params.toString(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Gagal mengambil data video."
            );

        }


        totalPages =
            Number(
                data.totalPages || 1
            );


        renderVideos(
            data.videos || []
        );


        statusEl.textContent =
            `${Number(data.total || 0).toLocaleString("id-ID")} video ditemukan`;


        updatePagination();


    } catch (error) {

        console.error(
            "VIDEO API ERROR:",
            error
        );


        statusEl.textContent =
            "";


        messageEl.style.display =
            "block";


        messageEl.textContent =
            "Video belum dapat dimuat. Silakan coba lagi.";

    }

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(videos) {

    videoGrid.innerHTML = "";


    if (!videos.length) {

        messageEl.style.display =
            "block";

        messageEl.textContent =
            "Tidak ada video yang ditemukan.";

        return;

    }


    videos.forEach(video => {

        const card =
            document.createElement("a");


        card.className =
            "video-card";


        card.href =
            video.url || "#";


        card.target =
            "_blank";


        card.rel =
            "noopener noreferrer";


        const thumbnail =
            video.thumbnail ||
            (
                "https://i.ytimg.com/vi/" +
                video.videoId +
                "/hqdefault.jpg"
            );


        const views =
            Number(
                video.views || 0
            ).toLocaleString("id-ID");


        const likes =
            Number(
                video.likes || 0
            ).toLocaleString("id-ID");


        const date =
            formatDate(
                video.publishedAt
            );


        card.innerHTML = `

            <div class="thumbnail">

                <img
                    src="${escapeHtml(thumbnail)}"
                    alt="${escapeHtml(video.title || "Video")}"
                    loading="lazy">

                <div class="play">
                    <span>▶</span>
                </div>

            </div>


            <div class="video-info">

                <div class="video-title">
                    ${escapeHtml(
                        video.title ||
                        "Tanpa judul"
                    )}
                </div>


                <div class="publisher">
                    ${escapeHtml(
                        video.channel ||
                        "BKD Media"
                    )}
                </div>


                <div class="meta">

                    ${views} views

                    ${
                        likes
                            ? " • " + likes + " likes"
                            : ""
                    }

                    ${
                        date
                            ? " • " + date
                            : ""
                    }

                </div>

            </div>

        `;


        videoGrid.appendChild(
            card
        );

    });

}


/* =====================================================
   CHANNEL FILTER
===================================================== */

function changeChannel(channel) {

    currentChannel =
        channel;


    currentPage =
        1;


    document
        .querySelectorAll(".filter-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.channel === channel
            );

        });


    loadVideos();

}


/* =====================================================
   PREVIOUS PAGE
===================================================== */

function previousPage() {

    if (currentPage <= 1) {
        return;
    }


    currentPage--;


    loadVideos();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage() {

    if (currentPage >= totalPages) {
        return;
    }


    currentPage++;


    loadVideos();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   PAGINATION UI
===================================================== */

function updatePagination() {

    pageInfo.textContent =
        `Halaman ${currentPage} dari ${totalPages}`;


    prevBtn.disabled =
        currentPage <= 1;


    nextBtn.disabled =
        currentPage >= totalPages;

}


/* =====================================================
   SEARCH
===================================================== */

let searchTimer;


searchInput.addEventListener(
    "input",
    function () {

        clearTimeout(
            searchTimer
        );


        searchTimer =
            setTimeout(
                () => {

                    currentQuery =
                        searchInput.value.trim();


                    currentPage =
                        1;


                    loadVideos();

                },
                500
            );

    }
);


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleDateString(
        "id-ID",
        {
            day: "numeric",
            month: "short",
            year: "numeric"
        }
    );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

loadVideos();

</script>

</body>
</html>
