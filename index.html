<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BKD GO | Pusat Link Resmi BKD Media</title>

<meta name="description" content="BKD GO merupakan pusat link resmi BKD Media. Temukan YouTube, Website, TikTok, Instagram, Facebook dan seluruh tautan resmi dalam satu halaman.">

<meta name="keywords" content="BKD GO, BKD Media, BKD Tutorials, Link Resmi, Tutorial Indonesia">

<meta name="author" content="BKD Media">

<meta property="og:title" content="BKD GO">

<link rel="icon" href="favicon.png">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#081221;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:25px;
color:#fff;
overflow-x:hidden;
}

.background{
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#2563eb33,transparent 50%),
radial-gradient(circle at bottom,#0ea5e933,transparent 45%);
z-index:-1;
}

.card{
width:100%;
max-width:420px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:28px;
padding:35px 28px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.35);
animation:fade .7s ease;
}

.logo{
    width:125px;
    height:125px;
    margin:auto;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:center;
}
  
.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 18px rgba(37,99,235,.55));
    animation:logoGlow 3s ease-in-out infinite;
}

@keyframes logoGlow{
    0%,100%{
        filter:drop-shadow(0 0 18px rgba(37,99,235,.45));
    }
    50%{
        filter:drop-shadow(0 0 30px rgba(37,99,235,.75));
    }
} 

h1{
font-size:42px;
font-weight:700;
margin-bottom:10px;
}

.subtitle{
color:#cbd5e1;
font-size:16px;
margin-bottom:30px;
}

.btn{
display:block;
text-decoration:none;
background:linear-gradient(135deg,#2563eb,#0ea5e9);
color:#fff;
padding:17px;
margin:14px 0;
border-radius:16px;
font-size:18px;
font-weight:bold;
transition:.3s;
box-shadow:0 8px 18px rgba(37,99,235,.35);
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 14px 28px rgba(37,99,235,.45);
}

.btn:active{
transform:scale(.98);
}

footer{
margin-top:28px;
color:#94a3b8;
font-size:14px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:480px){

.card{
padding:28px 20px;
}

h1{
font-size:34px;
}

.logo{
width:82px;
height:82px;
font-size:38px;
}

.btn{
font-size:17px;
padding:16px;
}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="card">

<div class="logo">
    <img src="logo.svg" alt="BKD Media Logo">
</div>

<h1>BKD GO</h1>

<p class="subtitle">
Pusat Link Resmi BKD Media
</p>

<a class="btn" href="https://youtube.com/@BKDTutorials" target="_blank">
<i class="fa-brands fa-youtube"></i> YouTube
</a>

<a class="btn" href="https://www.bkdtutorials.com" target="_blank">
<i class="fa-solid fa-globe"></i> Website
</a>

<a class="btn" href="https://tiktok.com/@bkdtutorials" target="_blank">
<i class="fa-brands fa-tiktok"></i> TikTok
</a>

<a class="btn" href="https://www.instagram.com/bkdtutorials">
<i class="fa-brands fa-instagram"></i> Instagram
</a>

<a class="btn" href="https://www.facebook.com/bkdtutorials">
<i class="fa-brands fa-facebook-f"></i> Facebook
</a>

<a class="btn" href="https://t.me/idrusd">
<i class="fa-brands fa-telegram"></i> Telegram
</a>

<footer>

© 2026 BKD Media

</footer>

</div>

<script>

document.querySelectorAll(".btn").forEach(button=>{

button.addEventListener("click",function(){

button.style.transform="scale(.96)";

setTimeout(()=>{

button.style.transform="scale(1)";

},150);

});

});

document.title="BKD GO | Pusat Link Resmi BKD Media";

console.log("BKD GO Loaded Successfully");

</script>

</body>
</html>
