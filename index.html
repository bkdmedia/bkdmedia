<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BKD GO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:90%;
max-width:420px;
background:#111827;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
font-size:36px;
font-weight:bold;
margin-bottom:20px;
}

h1{
margin-bottom:10px;
}

p{
color:#cbd5e1;
margin-bottom:30px;
}

.btn{
display:block;
text-decoration:none;
background:#2563eb;
color:white;
padding:16px;
border-radius:12px;
margin:12px 0;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#1d4ed8;
transform:translateY(-2px);
}

.footer{
margin-top:25px;
font-size:13px;
color:#94a3b8;
}
</style>

</head>
<body>

<div class="card">

<div class="logo">B</div>

<h1>BKD GO</h1>

<p>Pusat Link Resmi BKD Media</p>

<a class="btn" href="#">YouTube</a>

<a class="btn" href="#">TikTok</a>

<a class="btn" href="#">Website</a>

<a class="btn" href="#">Instagram</a>

<a class="btn" href="#">Facebook</a>

<div class="footer">
© 2026 BKD Media
</div>

</div>

</body>
</html>
